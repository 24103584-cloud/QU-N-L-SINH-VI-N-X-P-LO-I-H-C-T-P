
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sinh viên</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>QUẢN LÝ SINH VIÊN</h1>
    <h3>&amp; XẾP LOẠI HỌC TẬP</h3>

    <h2>Thông tin sinh viên</h2>
    <label for="name">Họ và tên sinh viên</label>
    <input type="text" id="name" placeholder="Nhập họ và tên sinh viên">

    <h2>Điểm các môn học</h2>

    <div class="subject">
        <label for="score1">1. Giải tích 1</label>
        <input type="number" id="score1" min="0" max="10" step="0.1" placeholder="0 - 10">
    </div>

    <div class="subject">
        <label for="score2">2. Đại số tuyến tính</label>
        <input type="number" id="score2" min="0" max="10" step="0.1" placeholder="0 - 10">
    </div>

    <div class="subject">
        <label for="score3">3. Xác suất thống kê</label>
        <input type="number" id="score3" min="0" max="10" step="0.1" placeholder="0 - 10">
    </div>

    <div class="subject">
        <label for="score4">4. Tin học đại cương</label>
        <input type="number" id="score4" min="0" max="10" step="0.1" placeholder="0 - 10">
    </div>

    <div class="subject">
        <label for="score5">5. Xây dựng ứng dụng Web</label>
        <input type="number" id="score5" min="0" max="10" step="0.1" placeholder="0 - 10">
    </div>

    <button id="calculate">Tính kết quả</button>
    <p id="error"></p>

    <h2>Kết quả học tập</h2>
    <p><strong>Sinh viên: </strong><span id="studentResult"></span></p>

    <table>
        <thead>
            <tr>
                <th>STT</th>
                <th>Môn học</th>
                <th>Điểm</th>
            </tr>
        </thead>
        <tbody id="resultTable"></tbody>
    </table>

    <p>Điểm trung bình <strong id="average">0.00</strong></p>
    <p>Xếp loại học tập <strong id="classification">-</strong></p>

    <script src="script.js"></script>
</body>
</html>
